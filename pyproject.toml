[project]
name = "context-harness"
version = "0.1.0"
description = "Research harness for agent-managed context and user memory on HorizonBench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "google-genai>=1.0",
    "huggingface_hub>=0.24",
    "openai>=1.0",
    "pyarrow>=17",
]

[project.scripts]
context-harness = "context_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Raised inside google-genai on Python 3.14; not from this project.
filterwarnings = ["ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning"]
